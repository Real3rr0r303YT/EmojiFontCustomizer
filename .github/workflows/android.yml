name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional release signing. Without these secrets the release is published with
      # the debug APK, which is signed with a throwaway key on every run.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests & build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: EmojiFontCustomizer-apk
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error

      - name: Prepare release
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            apk=app/build/outputs/apk/release/app-release.apk
            kind=release
          else
            apk=app/build/outputs/apk/debug/app-debug.apk
            kind=debug
          fi
          cp "$apk" "EmojiFontCustomizer-${tag}-${kind}.apk"
          sha256sum "EmojiFontCustomizer-${tag}-${kind}.apk" > "EmojiFontCustomizer-${tag}-${kind}.apk.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          files: |
            EmojiFontCustomizer-*.apk
            EmojiFontCustomizer-*.apk.sha256
          generate_release_notes: true
          make_latest: true
          body: |
            Built automatically from ${{ github.sha }}.
            APK: `${{ steps.release.outputs.kind }}` build. Verify it with the `.sha256` file.
